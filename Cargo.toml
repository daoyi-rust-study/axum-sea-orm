[workspace]
members = [
    ".",
    "api",
    "common",
    "core",
    "middleware",
    "migration"
]
[package]
name = "axum-sea-orm"
version = "0.1.0"
edition = "2024"

[dependencies]
api = { path = "api" }
dotenvy = { workspace = true }

[workspace.dependencies]
axum = "0.8.4"
axum-extra = "0.10.1"
tokio = { version = "1.45.0", features = ["full"] }
dotenvy = "0.15.7"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
api = { path = "api" }
common = { path = "common" }
sea-orm = { version = "1.1.11", features = ["sqlx-mysql"] }
anyhow = "1.0.98"
thiserror = "2.0.12"
